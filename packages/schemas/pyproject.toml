[project]
name = "dd-schemas"
version = "0.1.0"
description = "Schema registry for EU-sovereign real-estate due-diligence extraction (ES/FR/EN)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dd_schemas*"]
