name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -q -e ./packages/schemas -e "./api[dev]"
      - name: Tests
        run: PYTHONPATH=api:packages/schemas:scripts python -m pytest api/tests -q
      - name: Eval harness (gold set — fails on regression)
        run: PYTHONPATH=api:packages/schemas:scripts python eval/run_eval.py
      - name: End-to-end seed
        run: PYTHONPATH=api:packages/schemas:scripts python scripts/seed_demo.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build (typecheck + bundle)
        working-directory: web
        run: |
          npm install
          npm run build
